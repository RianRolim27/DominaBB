<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DominaBB — o material que usei pra estudar pro concurso do BB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0A;
    --bg-2:#121212;
    --bg-3:#181818;
    --text:#F2F1ED;
    --text-soft:#A8A8A6;
    --text-mute:#6E6E6C;
    --yellow:#FFCC00;
    --blue:#3E7BFA;
    --line:rgba(242,241,237,0.10);
    --line-strong:rgba(242,241,237,0.18);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Sora',sans-serif;
    font-size:17px;
    line-height:1.65;
  }
  h1,h2,h3{font-weight:600;margin:0;letter-spacing:-0.01em;}
  p{margin:0 0 1em;color:var(--text-soft);}
  .wrap{max-width:1040px;margin:0 auto;padding:0 32px;}
  .measure{max-width:620px;}
  a{color:inherit;text-decoration:none;}
  .accent{color:var(--yellow);}

  .hero{padding:96px 0 90px;border-bottom:1px solid var(--line);}
  .hero-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:56px;align-items:center;}
  .eyebrow{font-size:14px;color:var(--yellow);margin:0 0 18px;font-weight:500;}
  .hero h1{font-size:46px;line-height:1.16;color:var(--text);}
  .hero p.lede{font-size:18px;color:var(--text-soft);margin-top:22px;max-width:480px;}
  .cta-row{margin-top:34px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .btn{
    display:inline-block;
    background:var(--yellow);
    color:#0A0A0A;
    font-weight:700;
    font-size:16px;
    padding:16px 30px;
    border-radius:6px;
    border:none;
    cursor:pointer;
  }
  .price-tag{font-size:14px;color:var(--text-mute);}
  .price-tag strong{color:var(--text);font-size:18px;}

  .route-holder svg{width:100%;height:auto;display:block;}

  section{padding:88px 0;}
  .section-label{font-size:14px;color:var(--yellow);margin-bottom:14px;font-weight:500;}
  h2.section-title{font-size:32px;line-height:1.22;margin-bottom:26px;color:var(--text);}

  .story{background:var(--bg-2);border-bottom:1px solid var(--line);}
  .story-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;}
  .story-year{font-size:15px;color:var(--text-mute);letter-spacing:0.02em;}
  .story p.quote{
    font-size:21px;
    font-weight:600;
    color:var(--text);
    border-left:2px solid var(--blue);
    padding-left:22px;
    margin:28px 0;
  }
  .sign{margin-top:22px;font-size:15px;color:var(--text-mute);}

  .problem-list{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:40px;border-top:1px solid var(--line);}
  .problem-item{padding:30px 26px 30px 0;border-right:1px solid var(--line);}
  .problem-item:last-child{border-right:none;padding-right:0;}
  .problem-item .num{font-size:14px;color:var(--blue);display:block;margin-bottom:12px;font-weight:600;}
  .problem-item h3{font-size:18px;margin-bottom:8px;color:var(--text);}
  .problem-item p{font-size:15.5px;margin:0;}

  .method{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .steps{margin-top:48px;}
  .step{display:grid;grid-template-columns:56px 1fr;gap:24px;padding:28px 0;border-top:1px solid var(--line);}
  .step:last-child{border-bottom:1px solid var(--line);}
  .step .step-num{font-size:22px;font-weight:700;color:var(--yellow);}
  .step h3{font-size:20px;margin-bottom:8px;color:var(--text);}
  .step p{margin:0;font-size:15.5px;max-width:520px;}

  .fw-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:40px;background:var(--line);}
  .fw-col{background:var(--bg);padding:32px;}
  .fw-col h3{font-size:18px;margin-bottom:18px;}
  .fw-col ul{margin:0;padding:0;list-style:none;}
  .fw-col li{padding:10px 0;border-top:1px solid var(--line);font-size:15.5px;color:var(--text-soft);}
  .fw-col li:first-of-type{border-top:none;}
  .fw-yes h3{color:var(--yellow);}
  .fw-no h3{color:var(--text-mute);}

  .offer{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .offer-card{
    background:var(--bg-3);
    border:1px solid var(--line-strong);
    border-radius:10px;
    padding:48px;
    max-width:560px;
    margin:0 auto;
    text-align:center;
  }
  .offer-card .section-label{justify-content:center;}
  .offer-card h2{font-size:27px;margin-bottom:10px;color:var(--text);}
  .price-line{margin:26px 0;}
  .price-big{font-size:50px;font-weight:700;color:var(--yellow);}
  .price-note{font-size:14px;color:var(--text-mute);margin-top:6px;}
  .update-note{font-size:13px;color:var(--text-mute);margin:0 0 22px;}
  .payment-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin:22px 0 26px;}
  .pay-pill{border:1px solid var(--line-strong);border-radius:20px;padding:6px 14px;font-size:13px;color:var(--text-soft);}
  .pay-note{font-size:12.5px;color:var(--text-mute);width:100%;}

  .nav{padding:22px 0;border-bottom:1px solid var(--line);}
  .logo{font-size:19px;font-weight:700;letter-spacing:-0.01em;}
  .logo .bb{color:var(--yellow);}

  .indice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);margin-top:36px;border:1px solid var(--line);}
  .indice-item{background:var(--bg-2);padding:20px 22px;display:flex;align-items:center;gap:14px;}
  .indice-item .idx-num{font-size:13px;color:var(--yellow);font-weight:700;min-width:20px;}
  .indice-item .idx-name{font-size:15px;color:var(--text);}
  .indice-item .idx-badge{margin-left:auto;font-size:11px;color:var(--text-mute);border:1px solid var(--line-strong);border-radius:20px;padding:3px 10px;white-space:nowrap;}
  .indice-foot{margin-top:18px;font-size:14px;color:var(--text-mute);}

  .benefits-card{background:var(--bg-2);border
